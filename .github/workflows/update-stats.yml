name: Update Profile Cards
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p profile

      - name: Generate stats card (self-hosted, calls GitHub API directly)
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=the-yesh21&show_icons=true&include_all_commits=true&count_private=true&theme=tokyonight&bg_color=050816&title_color=62DAFF&icon_color=62DAFF&text_color=C9D1D9&border_color=15395D'
          path: profile/stats.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Generate trophies (self-hosted, calls GitHub API directly)
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: the-yesh21
          file: profile/trophies.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: "Fetch streak card (safe - retries, validates all-time totals, keeps old file if it fails)"
        run: |
          curl -f -s --retry 5 --retry-delay 15 --retry-connrefused \
            "https://streak-stats.demolab.com/?user=the-yesh21&theme=tokyonight&background=050816&ring=62DAFF&fire=FFD166&currStreakLabel=62DAFF&sideLabels=9fe7ff&border=15395D" \
            -o profile/streak.svg.tmp || true

          if [ -s profile/streak.svg.tmp ] && grep -q "<svg" profile/streak.svg.tmp && ! grep -qi "Failed to retrieve" profile/streak.svg.tmp; then
            mv profile/streak.svg.tmp profile/streak.svg
            echo "Streak card updated successfully"
          else
            echo "Streak fetch returned invalid content - keeping previous file"
            rm -f profile/streak.svg.tmp
          fi

      - name: Generate activity graph (self-contained, no third-party server)
        env:
          GH_TOKEN: ${{ secrets.TROPHY_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os, json, urllib.request

          token = os.environ["GH_TOKEN"]
          username = "the-yesh21"

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          try:
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": query, "variables": {"login": username}}).encode(),
                  headers={
                      "Authorization": f"bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)

              weeks = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]
              days = []
              for w in weeks:
                  for d in w["contributionDays"]:
                      days.append((d["date"], d["contributionCount"]))
              days.sort()
              last31 = days[-31:]

              if not last31:
                  raise ValueError("No contribution data returned")

              width, height = 1000, 300
              margin_left, top, bottom = 50, 40, 50
              plot_w = width - margin_left - 40
              plot_h = height - top - bottom
              max_count = max((c for _, c in last31), default=1) or 1
              n = len(last31)
              step = plot_w / max(n - 1, 1)

              points = []
              for i, (date, count) in enumerate(last31):
                  x = margin_left + i * step
                  y = top + plot_h - (count / max_count) * plot_h
                  points.append((x, y))

              line_path = "M " + " L ".join(f"{x:.1f},{y:.1f}" for x, y in points)
              area_path = (
                  line_path
                  + f" L {points[-1][0]:.1f},{top + plot_h:.1f}"
                  + f" L {points[0][0]:.1f},{top + plot_h:.1f} Z"
              )
              circles = "".join(
                  f'<circle cx="{x:.1f}" cy="{y:.1f}" r="3" fill="#FFD166"/>'
                  for x, y in points
              )
              labels = "".join(
                  f'<text x="{margin_left + i * step:.1f}" y="{height - 15}" '
                  f'font-size="10" fill="#9fe7ff" text-anchor="middle">{int(date[-2:])}</text>'
                  for i, (date, _) in enumerate(last31)
                  if i % 2 == 0
              )

              svg = f"""<svg viewBox="0 0 {width} {height}" xmlns="http://www.w3.org/2000/svg">
                <rect width="100%" height="100%" fill="#050816" rx="10"/>
                <text x="{width / 2}" y="25" font-size="16" fill="#62DAFF" text-anchor="middle" font-weight="bold">YESHWANTH V's Contribution Graph</text>
                <path d="{area_path}" fill="#9fe7ff" fill-opacity="0.15"/>
                <path d="{line_path}" fill="none" stroke="#62DAFF" stroke-width="2"/>
                {circles}
                {labels}
              </svg>"""

              with open("profile/activity-graph.svg.tmp", "w") as f:
                  f.write(svg)
              os.replace("profile/activity-graph.svg.tmp", "profile/activity-graph.svg")
              print("Activity graph generated successfully")

          except Exception as e:
              print(f"Activity graph generation failed ({e}) - keeping previous file")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git pull --rebase origin main
          git push
