name: Update Profile Cards
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p profile

      - name: Generate stats card (self-hosted, calls GitHub API directly)
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=the-yesh21&show_icons=true&include_all_commits=true&count_private=true&theme=tokyonight&bg_color=050816&title_color=62DAFF&icon_color=62DAFF&text_color=C9D1D9&border_color=15395D'
          path: profile/stats.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Generate trophies (self-hosted, calls GitHub API directly)
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: the-yesh21
          file: profile/trophies.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Generate streak card (self-hosted, calls GitHub API directly)
        uses: be-next/github-streak-stats-action@v1
        with:
          username: the-yesh21
          token: ${{ secrets.TROPHY_TOKEN }}
          output-path: profile/streak.svg
          theme: dark
          hide-border: true

      - name: "Fetch activity graph (safe - retries, keeps old file if it fails)"
        run: |
          curl -f -s --retry 5 --retry-delay 15 --retry-connrefused \
            "https://github-readme-activity-graph.vercel.app/graph?username=the-yesh21&bg_color=050816&color=9fe7ff&line=62DAFF&point=FFD166&area=true&hide_border=false&border_color=15395D&radius=10" \
            -o profile/activity-graph.svg.tmp || true

          if [ -s profile/activity-graph.svg.tmp ] && grep -q "<svg" profile/activity-graph.svg.tmp; then
            mv profile/activity-graph.svg.tmp profile/activity-graph.svg
            echo "Activity graph updated successfully"
          else
            echo "Activity graph fetch returned invalid content - keeping previous file"
            rm -f profile/activity-graph.svg.tmp
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git pull --rebase origin main
          git push
