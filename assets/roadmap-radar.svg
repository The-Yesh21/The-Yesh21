<svg viewBox="0 0 900 225" width="100%" height="225" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="225" rx="12" fill="#060b19" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left Column: ACTIVE SPRINT -->
  <rect x="20" y="20" width="420" height="185" rx="8" fill="#0b1324" stroke="#0284c7" stroke-width="1"/>
  <text x="40" y="48" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8" letter-spacing="1.5">// ACTIVE_EXECUTION [NOW]</text>

  <!-- Pulsing Live Beacon -->
  <circle cx="415" cy="43" r="5" fill="#00e676">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <g font-family="monospace" font-size="12" fill="#e2e8f0">
    <text x="40" y="84">▸ <tspan fill="#38bdf8" font-weight="bold">APMC OCR</tspan>      :: Extraction → Reviewer Feedback</text>
    <text x="40" y="114">▸ <tspan fill="#38bdf8" font-weight="bold">NearBy</tspan>        :: MVP → Pilot → Real-World Loop</text>
    <text x="40" y="144">▸ <tspan fill="#38bdf8" font-weight="bold">ConsentFlow</tspan>   :: DPDP-Focused Consent Management</text>
    <text x="40" y="174">▸ <tspan fill="#00e676" font-weight="bold">Full-Time SWE</tspan> :: Where Engineering Depth Matters</text>
  </g>

  <!-- Right Column: HORIZON QUEUE -->
  <rect x="460" y="20" width="420" height="185" rx="8" fill="#0b1324" stroke="#334155" stroke-width="1"/>
  <text x="480" y="48" font-family="monospace" font-size="13" font-weight="bold" fill="#94a3b8" letter-spacing="1.5">// HORIZON_QUEUE [NEXT]</text>

  <!-- Scanning Radar Line -->
  <line x1="480" y1="62" x2="860" y2="62" stroke="#38bdf8" stroke-width="1" opacity="0.35">
    <animate attributeName="y1" values="62;188;62" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="62;188;62" dur="4s" repeatCount="indefinite"/>
  </line>

  <g font-family="monospace" font-size="12" fill="#94a3b8">
    <text x="480" y="84">▹ <tspan fill="#f8fafc">Legal AI Platform</tspan>  :: Judicial Workflow Systems</text>
    <text x="480" y="114">▹ <tspan fill="#f8fafc">Open-Source ML</tspan>     :: Core Tooling Contributions</text>
    <text x="480" y="144">▹ <tspan fill="#f8fafc">Technical Writing</tspan>  :: Systems &amp; Architecture Notes</text>
    <text x="480" y="174">▹ <tspan fill="#f8fafc">AI Ethics Research</tspan> :: Algorithmic Bias &amp; Auditing</text>
  </g>
</svg>
